name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag, version and changelog agree
        run: uv run --no-project python scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Install
        run: uv sync --locked --group dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: mypy
        run: uv run mypy
      - name: pyright
        run: uv run pyright

  build:
    name: build the distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Check the wheel (no XSDs, no runtime dependencies, py.typed)
        run: uv run --no-project python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mdxml/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this workflow's OIDC token; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: uv run --no-project python scripts/check_release.py --notes "$GITHUB_REF_NAME" > notes.md
      - name: Create the release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "mdxml ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md $prerelease dist/*
