[project]
name = "mdxml"
version = "0.1.0"
description = "Fast, zero-dependency, streaming parser for FMI 2.0 and 3.0 modelDescription.xml files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["fmi", "fmu", "modelDescription", "xml", "parser", "co-simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.scripts]
mdxml = "mdxml:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "pyright>=1.1.390",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.10"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplifications
    "C4",      # comprehensions
    "PIE",     # misc cleanups
    "RET",     # return statements
    "PERF",    # performance
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "ERA",     # commented-out code
    "PL",      # pylint
    "D",       # docstrings (src only, see per-file-ignores)
    "S",       # bandit security (src only)
    "FBT",     # boolean positional arguments (src only)
]
# Deliberately not selected: ANN and TC (strict mypy/pyright cover typing), PTH (os.path is used on
# purpose for str paths), EM/TRY003 (f-string error messages are fine), ARG (protocol methods take
# arguments they don't use), N818 (UnsupportedFmiVersion and UnsafeInput are deliberate names).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "FBT", "PLR2004", "PLC0415"]
"scripts/**" = ["D", "S", "FBT", "PLR2004", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 8
